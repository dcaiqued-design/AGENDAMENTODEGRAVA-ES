name: Ingest Control — testes do agente

on:
  pull_request:
    paths:
      - "backend/**"
      - "tests/**"
      - ".github/workflows/ingest-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "tests/**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Checagem de sintaxe
        run: python -m compileall -q backend tests
      - name: Testes unitários SQLite e agenda
        run: python -m unittest discover -s tests -v
